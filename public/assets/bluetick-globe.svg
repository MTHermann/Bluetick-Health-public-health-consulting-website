<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#0c2340;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#060e1a;stop-opacity:1"/>
    </radialGradient>
    <radialGradient id="globeGrad" cx="38%" cy="35%" r="60%">
      <stop offset="0%" style="stop-color:#1a4a7a;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#0a2a50;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#040d1f;stop-opacity:1"/>
    </radialGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="70%" style="stop-color:#00aaff;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#00aaff;stop-opacity:0.5"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="globeClip">
      <circle cx="150" cy="150" r="108"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="300" height="300" fill="url(#bgGrad)"/>

  <!-- R code text in background -->
  <g font-family="monospace" font-size="8" fill="#38bdf8" opacity="0.10">
    <text x="8" y="22">library(tidyverse)</text>
    <text x="8" y="38">df %&gt;% filter(</text>
    <text x="8" y="54">  status == 1) %&gt;%</text>
    <text x="8" y="70">ggplot(aes(x,y)) +</text>
    <text x="8" y="86">  geom_point()</text>
    <text x="160" y="22">coxph(Surv(t,e)</text>
    <text x="160" y="38">  ~ covariate)</text>
    <text x="160" y="54">glm(y ~ x1 + x2,</text>
    <text x="160" y="70">  family=binomial)</text>
    <text x="160" y="86">summary(model)</text>
    <text x="8" y="240">km &lt;- survfit(</text>
    <text x="8" y="256">  Surv(time,status)</text>
    <text x="8" y="272">  ~ group)</text>
    <text x="160" y="240">lm(y ~ x1 + x2)</text>
    <text x="160" y="256">plot(km_fit)</text>
    <text x="160" y="272">confint(model)</text>
  </g>

  <!-- Glow ring behind globe -->
  <circle cx="150" cy="150" r="120" fill="none" stroke="#00aaff" stroke-width="2" opacity="0.25" filter="url(#softGlow)"/>
  <circle cx="150" cy="150" r="115" fill="none" stroke="#00ccff" stroke-width="1" opacity="0.15"/>

  <!-- Globe sphere -->
  <circle cx="150" cy="150" r="108" fill="url(#globeGrad)"/>

  <!-- Latitude lines -->
  <g clip-path="url(#globeClip)" stroke="#38bdf8" stroke-width="0.4" fill="none" opacity="0.12">
    <ellipse cx="150" cy="150" rx="108" ry="30"/>
    <ellipse cx="150" cy="150" rx="90" ry="60"/>
    <ellipse cx="150" cy="120" rx="80" ry="20"/>
    <ellipse cx="150" cy="180" rx="80" ry="20"/>
    <line x1="150" y1="42" x2="150" y2="258"/>
    <line x1="42" y1="150" x2="258" y2="150"/>
    <line x1="80" y1="60" x2="80" y2="240"/>
    <line x1="220" y1="60" x2="220" y2="240"/>
  </g>

  <!-- Dotted landmasses clipped to globe -->
  <g clip-path="url(#globeClip)" fill="#67e8f9" opacity="0.80" filter="url(#glow)">
    <!-- North America -->
    <circle cx="82" cy="95" r="2.8"/><circle cx="91" cy="90" r="2.5"/><circle cx="100" cy="87" r="2.5"/>
    <circle cx="78" cy="106" r="2.5"/><circle cx="87" cy="102" r="2.8"/><circle cx="96" cy="98" r="2.5"/>
    <circle cx="74" cy="117" r="2"/><circle cx="83" cy="114" r="2.5"/><circle cx="92" cy="110" r="2.8"/>
    <circle cx="100" cy="107" r="2.5"/><circle cx="79" cy="126" r="2"/><circle cx="88" cy="122" r="2.5"/>
    <circle cx="96" cy="118" r="2"/><circle cx="75" cy="136" r="2"/><circle cx="84" cy="132" r="2.5"/>
    <circle cx="93" cy="129" r="2"/><circle cx="86" cy="142" r="2"/><circle cx="95" cy="139" r="2"/>

    <!-- Greenland -->
    <circle cx="115" cy="68" r="2.5"/><circle cx="124" cy="64" r="2"/><circle cx="120" cy="74" r="2"/>
    <circle cx="129" cy="70" r="2"/><circle cx="123" cy="80" r="2"/>

    <!-- Europe -->
    <circle cx="148" cy="83" r="2.5"/><circle cx="157" cy="80" r="2.5"/><circle cx="166" cy="77" r="2"/>
    <circle cx="150" cy="93" r="2.5"/><circle cx="159" cy="89" r="2.5"/><circle cx="168" cy="87" r="2"/>
    <circle cx="152" cy="102" r="2"/><circle cx="161" cy="99" r="2.5"/><circle cx="170" cy="96" r="2"/>
    <circle cx="154" cy="110" r="2"/><circle cx="163" cy="107" r="2"/><circle cx="172" cy="104" r="2"/>

    <!-- Africa -->
    <circle cx="155" cy="120" r="2.5"/><circle cx="164" cy="117" r="2.5"/><circle cx="173" cy="115" r="2"/>
    <circle cx="153" cy="131" r="2.5"/><circle cx="162" cy="128" r="3"/><circle cx="171" cy="126" r="2.5"/>
    <circle cx="151" cy="142" r="2.5"/><circle cx="160" cy="139" r="3"/><circle cx="169" cy="137" r="2.5"/>
    <circle cx="149" cy="153" r="2"/><circle cx="158" cy="150" r="2.5"/><circle cx="167" cy="148" r="2.5"/>
    <circle cx="148" cy="164" r="2"/><circle cx="157" cy="161" r="2.5"/><circle cx="165" cy="159" r="2"/>
    <circle cx="155" cy="171" r="2"/><circle cx="163" cy="169" r="2"/><circle cx="161" cy="179" r="2"/>

    <!-- Asia -->
    <circle cx="182" cy="82" r="2.5"/><circle cx="192" cy="79" r="2.5"/><circle cx="202" cy="77" r="2"/>
    <circle cx="178" cy="93" r="2.5"/><circle cx="188" cy="90" r="3"/><circle cx="198" cy="88" r="2.5"/>
    <circle cx="208" cy="86" r="2"/><circle cx="174" cy="104" r="2.5"/><circle cx="184" cy="101" r="3"/>
    <circle cx="194" cy="99" r="2.5"/><circle cx="204" cy="97" r="2.5"/><circle cx="214" cy="96" r="2"/>
    <circle cx="180" cy="114" r="2.5"/><circle cx="190" cy="112" r="2.5"/><circle cx="200" cy="110" r="2.5"/>
    <circle cx="210" cy="108" r="2"/><circle cx="220" cy="107" r="2"/><circle cx="186" cy="123" r="2.5"/>
    <circle cx="196" cy="121" r="2.5"/><circle cx="206" cy="119" r="2"/><circle cx="216" cy="118" r="2"/>

    <!-- Australia -->
    <circle cx="205" cy="162" r="2.5"/><circle cx="215" cy="159" r="2.5"/><circle cx="213" cy="170" r="2.5"/>
    <circle cx="201" cy="172" r="2"/><circle cx="211" cy="178" r="2"/><circle cx="219" cy="171" r="2"/>
    <circle cx="203" cy="181" r="2"/><circle cx="213" cy="183" r="2"/>

    <!-- South America -->
    <circle cx="98" cy="150" r="2.5"/><circle cx="108" cy="147" r="2.5"/><circle cx="104" cy="161" r="2.5"/>
    <circle cx="113" cy="158" r="2.5"/><circle cx="100" cy="172" r="2.5"/><circle cx="110" cy="169" r="2.5"/>
    <circle cx="98" cy="182" r="2"/><circle cx="108" cy="179" r="2.5"/><circle cx="102" cy="191" r="2"/>
    <circle cx="104" cy="200" r="2"/><circle cx="100" cy="191" r="2"/>

    <!-- Scattered texture dots -->
    <circle cx="140" cy="138" r="1.5"/><circle cx="178" cy="138" r="1.5"/><circle cx="128" cy="108" r="1.5"/>
    <circle cx="225" cy="125" r="1.5"/><circle cx="123" cy="154" r="1.5"/><circle cx="190" cy="155" r="1.5"/>
    <circle cx="135" cy="168" r="1.5"/><circle cx="145" cy="185" r="1.5"/>
  </g>

  <!-- Globe outer glow effect -->
  <circle cx="150" cy="150" r="108" fill="url(#glowGrad)"/>
  <circle cx="150" cy="150" r="108" fill="none" stroke="#00aaff" stroke-width="2.5" opacity="0.6" filter="url(#glow)"/>

  <!-- Branding text -->
  <text x="150" y="222" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="16" fill="#0ea5e9" letter-spacing="3" filter="url(#glow)">bluetick</text>
  <text x="150" y="242" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="18" fill="#ffffff" letter-spacing="4">HEALTH</text>
</svg>
