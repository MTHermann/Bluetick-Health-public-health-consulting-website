<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Detailed Stata regression and mixed-model background">
  <rect width="1600" height="900" fill="transparent" />
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill-opacity="0.9">
    <text x="64" y="98" fill="#0f766e">* Stata: linear, logistic, and mixed-effects regression workflow</text>
    <text x="64" y="144"><tspan fill="#0f766e">use</tspan><tspan fill="#334155"> "analysis_panel.dta", clear</tspan></text>
    <text x="64" y="190"><tspan fill="#0f766e">gen</tspan><tspan fill="#334155"> ln_cost = ln(total_cost + </tspan><tspan fill="#f59e0b">1</tspan><tspan fill="#334155">)</tspan></text>
    <text x="64" y="236"><tspan fill="#0f766e">regress</tspan><tspan fill="#334155"> outcome_score i.treatment c.age##c.age i.sex i.province, vce(robust)</tspan></text>
    <text x="64" y="282"><tspan fill="#0f766e">logit</tspan><tspan fill="#334155"> poor_outcome i.treatment c.baseline_cd4 c.adherence i.site, vce(cluster site)</tspan></text>
    <text x="64" y="328"><tspan fill="#0f766e">margins</tspan><tspan fill="#334155"> treatment, at(age=(</tspan><tspan fill="#f59e0b">20</tspan><tspan fill="#334155">(</tspan><tspan fill="#f59e0b">10</tspan><tspan fill="#334155">)</tspan><tspan fill="#f59e0b">70</tspan><tspan fill="#334155">)) post</tspan></text>
    <text x="64" y="374"><tspan fill="#0f766e">marginsplot</tspan><tspan fill="#334155">, recast(line) ciopts(color(teal%35)) title("Adjusted risk by age")</tspan></text>
    <text x="64" y="420"><tspan fill="#0f766e">mixed</tspan><tspan fill="#334155"> hb_change i.treatment c.week##i.treatment || facility: week, covariance(unstructured)</tspan></text>
    <text x="64" y="466"><tspan fill="#0f766e">estat</tspan><tspan fill="#334155"> ic</tspan><tspan fill="#0f766e">  // compare model fit</tspan></text>
    <text x="64" y="512"><tspan fill="#0f766e">predict</tspan><tspan fill="#334155"> re_facility, reffects</tspan></text>
    <text x="64" y="558"><tspan fill="#0f766e">xtset</tspan><tspan fill="#334155"> facility month</tspan><tspan fill="#0f766e">  // ready for panel time-series checks</tspan></text>
    <text x="64" y="604"><tspan fill="#0f766e">outreg2</tspan><tspan fill="#334155"> using "services_models.doc", replace dec(</tspan><tspan fill="#f59e0b">3</tspan><tspan fill="#334155">) ctitle("Primary models")</tspan></text>
  </g>
</svg>
