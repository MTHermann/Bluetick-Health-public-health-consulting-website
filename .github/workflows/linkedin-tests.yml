name: LinkedIn mock-only regression tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Client and public preservation
        run: node --test automation/linkedin/*.test.mjs
      - name: Backend mocks
        run: node --test automation/linkedin/backend/test/*.test.mjs
      - name: Administrator mocks
        run: node --test automation/linkedin/backend/admin-tests/*.test.mjs
      - run: npm ci
      - run: npm run build
      - run: npm run lint
