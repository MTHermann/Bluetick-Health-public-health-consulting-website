name: LinkedIn blog queue

on:
  workflow_run:
    workflows: ["Deploy website to GitHub Pages"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linkedin-queue
  cancel-in-progress: false

jobs:
  reconcile-and-dispatch:
    if: >-
      github.repository == 'MTHermann/Bluetick-Health-public-health-consulting-website' &&
      github.event.repository.default_branch == 'main' &&
      vars.LINKEDIN_AUTOMATION_ENABLED == 'true' &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository) ||
       (github.event_name != 'workflow_run' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Reconcile catalog and dispatch due posts
        env:
          LINKEDIN_BACKEND_URL: ${{ vars.LINKEDIN_BACKEND_URL }}
          LINKEDIN_AUTOMATION_SECRET: ${{ secrets.LINKEDIN_AUTOMATION_SECRET }}
        run: node automation/linkedin/run.mjs
